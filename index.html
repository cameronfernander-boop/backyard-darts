<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BYD">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Backyard Darts</title>
<style>
:root{--bg:#f5f6f4;--card:#fff;--ink:#16211b;--mute:#6b7a70;--green:#14532d;--green2:#1d7a43;--gold:#f4c430;--red:#c0392b;--line:#dfe4e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:0}
.screen{display:none;max-width:520px;margin:0 auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));min-height:100%}
.screen.on{display:flex;flex-direction:column}
h1{margin:8px 0 2px;font-size:28px;color:var(--green)}
.sub{color:var(--mute);margin:0 0 20px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:20px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 18px;font-weight:700;font-size:18px;color:var(--ink)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.row{display:flex;gap:8px;margin-bottom:8px}
.row input{flex:1;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font:inherit;background:var(--card)}
.x{background:var(--card);border:2px solid var(--line);border-radius:12px;width:48px;color:var(--mute)}
.link{background:none;color:var(--green2);font-weight:600;padding:8px 0}
.toggle{display:flex;align-items:center;gap:10px;margin-top:6px}
.toggle input{width:22px;height:22px}
.big{background:var(--green);color:#fff;border-radius:14px;padding:16px;font-size:18px;font-weight:700;width:100%;margin-top:20px}
.big.alt{background:var(--card);color:var(--green);border:2px solid var(--green);margin-top:10px}
header.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
header.bar button{background:none;color:var(--green2);font-weight:600;padding:8px 4px}
header.bar .t{font-weight:700}
#cards{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.pc{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.pc.cur{border-color:var(--green2);box-shadow:0 0 0 3px rgba(29,122,67,.15)}
.pc .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .s{font-size:40px;font-weight:800;line-height:1.1}
.pc .m{font-size:12px;color:var(--mute)}
#turn{text-align:center;font-weight:700;margin:16px 0 4px}
#display{text-align:center;font-size:56px;font-weight:800;min-height:68px}
#display.dim{color:#b9c2bc}
#leave{text-align:center;color:var(--mute);min-height:22px;margin-bottom:8px}
#keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
#keys button{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 0;font-size:24px;font-weight:700;color:var(--ink)}
#keys button:active{background:#e9eee9}
#keys .go{background:var(--green);border-color:var(--green);color:#fff;font-size:18px}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
#banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:900;color:var(--gold);text-shadow:0 4px 0 var(--green),0 8px 24px rgba(0,0,0,.35);opacity:0;pointer-events:none;z-index:20;transform:scale(.6)}
#banner.on{animation:pop 1.6s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.5)}15%{opacity:1;transform:scale(1.1)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:10}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal.on{display:flex}
.box{background:var(--card);border-radius:18px;padding:22px;max-width:360px;width:100%;text-align:center}
.box h3{margin:0 0 6px;font-size:22px}
.box p{color:var(--mute);margin:0 0 4px}
</style>
</head>
<body>

<section id="setup" class="screen on">
  <h1>Backyard Darts</h1>
  <p class="sub">Simple dart scoring.</p>
  <button id="resume" class="big alt" style="display:none">Resume last game</button>
  <h2>Game</h2>
  <div class="chips" id="games"></div>
  <h2>Players</h2>
  <div id="names"></div>
  <button id="add" class="link">+ Add player</button>
  <h2>Rules</h2>
  <label class="toggle"><input type="checkbox" id="dbl" checked> Double out (finish on a double or bullseye)</label>
  <button id="start" class="big">Start game</button>
</section>

<section id="game" class="screen">
  <header class="bar">
    <button id="menu">‹ Menu</button>
    <div class="t" id="gtitle"></div>
    <button id="undo">Undo</button>
  </header>
  <div id="cards"></div>
  <div id="turn"></div>
  <div id="display" class="dim">0</div>
  <div id="leave"></div>
  <div id="keys">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="del">⌫</button><button data-k="0">0</button><button data-k="go" class="go">Enter</button>
  </div>
</section>

<div class="modal" id="dblModal">
  <div class="box">
    <h3>Last dart a double?</h3>
    <p>Did the finishing dart land in a double or the bullseye?</p>
    <button class="big" id="dblYes">Yes, game shot!</button>
    <button class="big alt" id="dblNo">No, it's a bust</button>
  </div>
</div>

<div class="modal" id="winModal">
  <div class="box">
    <h3 id="winTitle"></h3>
    <p id="winStats"></p>
    <button class="big" id="rematch">Rematch</button>
    <button class="big alt" id="winMenu">Back to menu</button>
    <button class="link" id="winUndo">Undo last visit</button>
  </div>
</div>

<div id="toast"></div>
<div id="banner"></div>
<canvas id="confetti"></canvas>

<script>
const IMPOSSIBLE=[163,166,169,172,173,175,176,178,179];
const KEY='byd-game';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let G=null, entry='', setupStart=501, names=['Player 1','Player 2'];

function save(){try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}

/* ---------- setup ---------- */
function drawSetup(){
  const saved=load();
  $('resume').style.display=(saved&&!saved.over)?'block':'none';
  $('games').innerHTML=[101,301,501,701,1001].map(n=>`<button class="chip ${n===setupStart?'on':''}" data-n="${n}">${n}</button>`).join('');
  $('names').innerHTML=names.map((n,i)=>`<div class="row"><input data-i="${i}" value="${esc(n)}" maxlength="14" placeholder="Player ${i+1}">${names.length>1?`<button class="x" data-del="${i}">✕</button>`:''}</div>`).join('');
  $('add').style.display=names.length>=8?'none':'inline-block';
}
$('games').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b)return;setupStart=+b.dataset.n;drawSetup()});
$('names').addEventListener('input',e=>{if(e.target.dataset.i!==undefined)names[+e.target.dataset.i]=e.target.value});
$('names').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;names.splice(+b.dataset.del,1);drawSetup()});
$('add').addEventListener('click',()=>{if(names.length<8){names.push('Player '+(names.length+1));drawSetup()}});
$('start').addEventListener('click',()=>{
  const list=names.map((n,i)=>n.trim()||('Player '+(i+1)));
  G={start:setupStart,dbl:$('dbl').checked,players:list.map(n=>({name:n,score:setupStart,visits:[]})),turn:0,over:false,winner:null,log:[]};
  entry='';save();showGame();
});
$('resume').addEventListener('click',()=>{const s=load();if(s){G=s;entry='';showGame()}});

/* ---------- game ---------- */
function showGame(){show('game');draw()}
function avg(p){const n=p.visits.length;return n?(p.visits.reduce((a,v)=>a+v.v,0)/n).toFixed(1):'–'}
function draw(){
  $('gtitle').textContent=G.start+(G.dbl?' · Double out':' · Straight out');
  $('cards').innerHTML=G.players.map((p,i)=>{
    const last=p.visits.length?(p.visits[p.visits.length-1].bust?'Bust':p.visits[p.visits.length-1].v):'–';
    return `<div class="pc ${i===G.turn&&!G.over?'cur':''}"><div class="n">${esc(p.name)}</div><div class="s">${p.score}</div><div class="m">Avg ${avg(p)} · Last ${last}</div></div>`;
  }).join('');
  const p=G.players[G.turn];
  $('turn').textContent=G.over?'':p.name+"'s turn";
  const d=$('display');
  d.textContent=entry===''?'0':entry;
  d.classList.toggle('dim',entry==='');
  const v=entry===''?null:parseInt(entry,10);
  $('leave').textContent=(v!==null&&v<=p.score)?'Leaves '+(p.score-v):'';
  if(G.over){
    const w=G.players[G.winner];
    $('winTitle').textContent=w.name+' wins!';
    $('winStats').textContent='3-dart average '+avg(w)+' over '+w.visits.length+' visits';
    $('winModal').classList.add('on');
  }else $('winModal').classList.remove('on');
}
function key(k){
  if(!G||G.over||$('dblModal').classList.contains('on'))return;
  if(k==='del')entry=entry.slice(0,-1);
  else if(k==='go')return submit();
  else if(entry.length<3)entry+=k;
  draw();
}
$('keys').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)key(b.dataset.k)});
document.addEventListener('keydown',e=>{
  if(!$('game').classList.contains('on'))return;
  if(/^[0-9]$/.test(e.key))key(e.key);
  else if(e.key==='Backspace')key('del');
  else if(e.key==='Enter')key('go');
});
let pendingV=0;
function submit(){
  if(entry==='')return;
  const v=parseInt(entry,10);
  if(v>180||IMPOSSIBLE.includes(v)){toast("That score isn't possible with 3 darts");entry='';draw();return}
  const p=G.players[G.turn],left=p.score-v;
  const bust=left<0||(G.dbl&&left===1);
  if(!bust&&left===0&&G.dbl){pendingV=v;$('dblModal').classList.add('on');return}
  commit(v,bust);
}
function commit(v,bust){
  const p=G.players[G.turn];
  G.log.push({p:G.turn,prev:p.score});
  if(bust){p.visits.push({v:0,bust:true});toast('Bust!')}
  else{p.score-=v;p.visits.push({v,bust:false});if(v>=95)celebrate(v)}
  entry='';
  if(p.score===0&&!bust){G.over=true;G.winner=G.turn;if(v<95)confetti()}
  else G.turn=(G.turn+1)%G.players.length;
  save();draw();
}
$('dblYes').addEventListener('click',()=>{$('dblModal').classList.remove('on');commit(pendingV,false)});
$('dblNo').addEventListener('click',()=>{$('dblModal').classList.remove('on');commit(pendingV,true)});
function undo(){
  if(!G||!G.log.length)return;
  const e=G.log.pop();
  G.players[e.p].visits.pop();
  G.players[e.p].score=e.prev;
  G.turn=e.p;G.over=false;G.winner=null;entry='';
  save();draw();
}
$('undo').addEventListener('click',undo);
$('winUndo').addEventListener('click',undo);
$('menu').addEventListener('click',()=>{drawSetup();show('setup')});
$('winMenu').addEventListener('click',()=>{$('winModal').classList.remove('on');drawSetup();show('setup')});
$('rematch').addEventListener('click',()=>{
  G={start:G.start,dbl:G.dbl,players:G.players.map(p=>({name:p.name,score:G.start,visits:[]})),turn:0,over:false,winner:null,log:[]};
  entry='';save();draw();
});

/* ---------- toast, banner, confetti ---------- */
let tt;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}
function celebrate(v){
  const b=$('banner');b.textContent=v+'!';b.classList.remove('on');void b.offsetWidth;b.classList.add('on');
  confetti();
  if(navigator.vibrate)navigator.vibrate(v===180?[80,60,80,60,160]:[120]);
}
const cv=$('confetti'),cx=cv.getContext('2d');let parts=[],raf=0;
function confetti(){
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#f4c430','#e63946','#2a9d8f','#457b9d','#ffffff','#f4a261'];
  for(let i=0;i<170;i++)parts.push({x:innerWidth/2,y:innerHeight*0.38,vx:(Math.random()-.5)*18,vy:Math.random()*-15-2,s:5+Math.random()*7,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:0});
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.y<cv.height+20&&p.life<220);
  for(const p of parts){
    p.vy+=.4;p.vx*=.995;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();
  }
  if(parts.length)raf=requestAnimationFrame(loop);else{raf=0;cx.clearRect(0,0,cv.width,cv.height)}
}

/* ---------- start ---------- */
drawSetup();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
