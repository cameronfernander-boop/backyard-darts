<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BYD">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Backyard Darts</title>
<style>
:root{--bg:#f5f6f4;--card:#fff;--ink:#16211b;--mute:#6b7a70;--green:#14532d;--green2:#1d7a43;--gold:#f4c430;--red:#c0392b;--line:#dfe4e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,#display,#cards,.cb{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:0}
.screen{display:none;max-width:520px;margin:0 auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));min-height:100%}
.screen.on{display:flex;flex-direction:column}
h1{margin:8px 0 2px;font-size:28px;color:var(--green)}
.sub{color:var(--mute);margin:0 0 20px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:20px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 18px;font-weight:700;font-size:18px;color:var(--ink)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.row{display:flex;gap:8px;margin-bottom:8px}
.row input{flex:1;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font:inherit;background:var(--card)}
.x{background:var(--card);border:2px solid var(--line);border-radius:12px;width:48px;color:var(--mute)}
select{flex:1;min-width:0;padding:12px;border:2px solid var(--line);border-radius:12px;font:inherit;background:var(--card);color:var(--ink)}
.link{background:none;color:var(--green2);font-weight:600;padding:8px 0}
.toggle{display:flex;align-items:center;gap:10px;margin-top:6px}
.toggle input{width:22px;height:22px}
.big{background:var(--green);color:#fff;border-radius:14px;padding:16px;font-size:18px;font-weight:700;width:100%;margin-top:20px}
.big.alt{background:var(--card);color:var(--green);border:2px solid var(--green);margin-top:10px}
header.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
header.bar button{background:none;color:var(--green2);font-weight:600;padding:8px 4px}
header.bar .t{font-weight:700}
#cards,#acards{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.pc{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.pc.cur{border-color:var(--green2);box-shadow:0 0 0 3px rgba(29,122,67,.15)}
.pc .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .s{font-size:40px;font-weight:800;line-height:1.1}
.pc .m{font-size:12px;color:var(--mute)}
.pb{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}
.pb i{display:block;height:100%;background:var(--green2)}
.turn{text-align:center;font-weight:700;margin:16px 0 4px}
.darts{text-align:center;font-size:22px;letter-spacing:6px;color:var(--green2);min-height:28px}
#display{text-align:center;font-size:56px;font-weight:800;min-height:68px}
#display.dim{color:#b9c2bc}
#leave{text-align:center;color:var(--mute);min-height:22px;margin-bottom:8px}
#keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
#keys button{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 0;font-size:24px;font-weight:700;color:var(--ink)}
#keys button:active{background:#e9eee9}
#keys .go{background:var(--green);border-color:var(--green);color:#fff;font-size:18px}
.cb{display:grid;gap:4px;align-items:center;margin-bottom:6px}
.ch{font-weight:700;font-size:13px;text-align:center;padding:6px 2px;border-radius:8px;background:var(--card);border:2px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch.cur{border-color:var(--green2);background:#e8f3ec}
.ct{font-weight:800;font-size:18px;text-align:center}
.cm{background:var(--card);border:2px solid var(--line);border-radius:8px;text-align:center;font-size:24px;font-weight:800;height:40px;line-height:36px;color:var(--green)}
.cm.cur{border-color:var(--green2)}
.cm.done{background:var(--green);border-color:var(--green);color:#fff}
.cp{text-align:center;font-weight:800;font-size:20px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.seg button{padding:12px 0;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;color:var(--ink)}
.seg button.on{background:var(--green);border-color:var(--green);color:#fff}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tgrid button{padding:18px 0;font-size:22px;font-weight:800;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.tgrid button:active{background:#e9eee9}
.tgrid .miss{color:var(--red)}
.aim{text-align:center;font-size:72px;font-weight:900;color:var(--green);line-height:1.1;margin:10px 0}
#abtns{grid-template-columns:repeat(2,1fr)}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
#banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:900;color:var(--gold);text-shadow:0 4px 0 var(--green),0 8px 24px rgba(0,0,0,.35);opacity:0;pointer-events:none;z-index:20;transform:scale(.6)}
#banner.on{animation:pop 1.6s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.5)}15%{opacity:1;transform:scale(1.1)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:10}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal.on{display:flex}
.box{background:var(--card);border-radius:18px;padding:22px;max-width:360px;width:100%;text-align:center}
.box h3{margin:0 0 6px;font-size:22px}
.box p{color:var(--mute);margin:0 0 4px}
</style>
</head>
<body>

<!-- ============ HOME / SETUP ============ -->
<section id="setup" class="screen on">
  <h1>Backyard Darts</h1>
  <p class="sub">Simple dart scoring.</p>
  <button id="resume" class="big alt" style="display:none">Resume last game</button>
  <h2>Game</h2>
  <div class="chips" id="games"></div>
  <h2>Players</h2>
  <div id="names"></div>
  <button id="add" class="link">+ Add player</button>
  <h2 id="rulesH">Rules</h2>
  <label class="toggle" id="rowDbl"><input type="checkbox" id="dbl" checked> Double out (finish on a double or bullseye)</label>
  <label class="toggle" id="rowSkip"><input type="checkbox" id="skip"> Doubles and triples jump ahead (2 or 3 numbers)</label>
  <h2>Caller voice</h2>
  <div class="row"><select id="voiceSel"></select><button id="voiceTest" class="x" style="width:auto;padding:0 16px">Test</button></div>
  <button id="start" class="big">Start game</button>
</section>

<!-- ============ X01 ============ -->
<section id="game" class="screen">
  <header class="bar">
    <button class="js-menu">‹ Menu</button>
    <div class="t" id="t-x01"></div>
    <div><button class="js-snd" title="Sound" style="font-size:20px">🔊</button><button class="js-undo">Undo</button></div>
  </header>
  <div id="cards"></div>
  <div class="turn" id="turn"></div>
  <div id="display" class="dim">0</div>
  <div id="leave"></div>
  <div id="keys">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="del">⌫</button><button data-k="0">0</button><button data-k="go" class="go">Enter</button>
  </div>
</section>

<!-- ============ CRICKET ============ -->
<section id="cricket" class="screen">
  <header class="bar">
    <button class="js-menu">‹ Menu</button>
    <div class="t">Cricket</div>
    <div><button class="js-snd" title="Sound" style="font-size:20px">🔊</button><button class="js-undo">Undo</button></div>
  </header>
  <div id="cboard"></div>
  <div class="turn" id="cturn"></div>
  <div class="darts" id="cdarts"></div>
  <div class="seg" id="cmult">
    <button data-m="1" class="on">Single</button><button data-m="2">Double</button><button data-m="3">Triple</button>
  </div>
  <div class="tgrid" id="ctargets">
    <button data-t="20">20</button><button data-t="19">19</button><button data-t="18">18</button><button data-t="17">17</button>
    <button data-t="16">16</button><button data-t="15">15</button><button data-t="25">Bull</button><button data-t="0" class="miss">Miss</button>
  </div>
  <button class="big alt" id="cend">End turn</button>
</section>

<!-- ============ AROUND THE WORLD ============ -->
<section id="atw" class="screen">
  <header class="bar">
    <button class="js-menu">‹ Menu</button>
    <div class="t">Around the World</div>
    <div><button class="js-snd" title="Sound" style="font-size:20px">🔊</button><button class="js-undo">Undo</button></div>
  </header>
  <div id="acards"></div>
  <div class="turn" id="aturn"></div>
  <div class="aim" id="aaim"></div>
  <div class="darts" id="adarts"></div>
  <div class="tgrid" id="abtns" style="margin-top:12px"></div>
  <button class="big alt" id="aend">End turn</button>
</section>

<div class="modal" id="dblModal">
  <div class="box">
    <h3>Last dart a double?</h3>
    <p>Did the finishing dart land in a double or the bullseye?</p>
    <button class="big" id="dblYes">Yes, game shot!</button>
    <button class="big alt" id="dblNo">No, it's a bust</button>
  </div>
</div>

<div class="modal" id="winModal">
  <div class="box">
    <h3 id="winTitle"></h3>
    <p id="winStats"></p>
    <button class="big" id="rematch">Rematch</button>
    <button class="big alt" id="winMenu">Back to menu</button>
    <button class="link" id="winUndo">Undo last move</button>
  </div>
</div>

<div id="toast"></div>
<div id="banner"></div>
<canvas id="confetti"></canvas>

<script>
const IMPOSSIBLE=[163,166,169,172,173,175,176,178,179];
const KEY='byd-game';
const CT=[20,19,18,17,16,15,25];
const MK=['','/','✕','⊗'];
const GAMES=[['101','101'],['301','301'],['501','501'],['701','701'],['1001','1001'],['cricket','Cricket'],['atw','Around the World']];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let G=null, entry='', setupGame='501', names=['Player 1','Player 2'], cm=1;

function save(){try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}

/* ---------- voice ---------- */
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function words(n){
  if(n<20)return ONES[n];
  if(n<100)return TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:'');
  if(n<1000)return ONES[Math.floor(n/100)]+' hundred'+(n%100?' and '+words(n%100):'');
  return 'one thousand'+(n%1000?' and '+words(n%1000):'');
}
let soundOn=true;
try{soundOn=localStorage.getItem('byd-sound')!=='off'}catch(e){}
function drawSound(){document.querySelectorAll('.js-snd').forEach(b=>b.textContent=soundOn?'🔊':'🔇')}
let voices=[],voiceName='';
try{voiceName=localStorage.getItem('byd-voice')||''}catch(e){}
const MALE=/daniel|aaron|evan|alex\b|fred|ryan|guy|david|mark|george|james|tom\b|oliver|arthur|gordon|reed|rishi|male|liam|thomas|eric|brandon|christopher|davis|andrew|bruce|lee\b/i;
const FEMALE=/samantha|karen|victoria|susan|moira|tessa|fiona|kate|serena|zira|hazel|jenny|aria|sara|emma|female|amy|ava|nicky|allison|joanna|catherine|libby|sonia|michelle|monica|ella|nora/i;
function rank(v){
  let s=0;
  if(/^en/i.test(v.lang))s+=10;
  if(MALE.test(v.name))s+=20;
  if(FEMALE.test(v.name))s-=30;
  if(/natural|neural|enhanced|premium|online|siri/i.test(v.name))s+=15;
  return s;
}
function loadVoices(){
  if(!('speechSynthesis' in window))return;
  voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>rank(b)-rank(a));
  const sel=$('voiceSel');
  if(!voices.length){sel.innerHTML='<option>Default voice</option>';return}
  if(!voices.some(v=>v.name===voiceName))voiceName=voices[0].name;
  sel.innerHTML=voices.map(v=>`<option value="${esc(v.name)}" ${v.name===voiceName?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('');
}
function say(t){
  if(!soundOn||!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    const v=voices.find(x=>x.name===voiceName);
    if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';
    u.rate=0.95;u.pitch=0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
$('voiceSel').addEventListener('change',e=>{
  voiceName=e.target.value;
  try{localStorage.setItem('byd-voice',voiceName)}catch(err){}
  say('One hundred and eighty!');
});
$('voiceTest').addEventListener('click',()=>{
  if(!soundOn){soundOn=true;try{localStorage.setItem('byd-sound','on')}catch(e){}drawSound()}
  say('One hundred and eighty! Three hundred and twenty-one left.');
});
document.querySelectorAll('.js-snd').forEach(b=>b.addEventListener('click',()=>{
  soundOn=!soundOn;
  try{localStorage.setItem('byd-sound',soundOn?'on':'off')}catch(e){}
  drawSound();
  if(soundOn)say('Sound on');else if('speechSynthesis' in window)speechSynthesis.cancel();
}));

/* ---------- setup ---------- */
function drawSetup(){
  const saved=load();
  $('resume').style.display=(saved&&!saved.over)?'block':'none';
  $('games').innerHTML=GAMES.map(([g,l])=>`<button class="chip ${g===setupGame?'on':''}" data-g="${g}">${l}</button>`).join('');
  const isX=/^\d+$/.test(setupGame);
  $('rowDbl').style.display=isX?'flex':'none';
  $('rowSkip').style.display=setupGame==='atw'?'flex':'none';
  $('rulesH').style.display=(isX||setupGame==='atw')?'block':'none';
  $('names').innerHTML=names.map((n,i)=>`<div class="row"><input data-i="${i}" value="${esc(n)}" maxlength="14" placeholder="Player ${i+1}">${names.length>1?`<button class="x" data-del="${i}">✕</button>`:''}</div>`).join('');
  $('add').style.display=names.length>=8?'none':'inline-block';
}
$('games').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;setupGame=b.dataset.g;drawSetup()});
$('names').addEventListener('input',e=>{if(e.target.dataset.i!==undefined)names[+e.target.dataset.i]=e.target.value});
$('names').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;names.splice(+b.dataset.del,1);drawSetup()});
$('add').addEventListener('click',()=>{if(names.length<8){names.push('Player '+(names.length+1));drawSetup()}});

function newGame(game,list,o){
  const base={players:null,turn:0,over:false,winner:null};
  if(game==='cricket')return {...base,type:'cricket',dartsLeft:3,hist:[],players:list.map(n=>({name:n,marks:{15:0,16:0,17:0,18:0,19:0,20:0,25:0},pts:0}))};
  if(game==='atw')return {...base,type:'atw',skip:!!o.skip,dartsLeft:3,hist:[],players:list.map(n=>({name:n,target:1,darts:0}))};
  const s=+game;
  return {...base,type:'x01',start:s,dbl:!!o.dbl,log:[],players:list.map(n=>({name:n,score:s,visits:[]}))};
}
$('start').addEventListener('click',()=>{
  const list=names.map((n,i)=>n.trim()||('Player '+(i+1)));
  G=newGame(setupGame,list,{dbl:$('dbl').checked,skip:$('skip').checked});
  entry='';cm=1;save();showGame();
});
$('resume').addEventListener('click',()=>{
  const s=load();
  if(s){G=s;G.type=G.type||'x01';entry='';cm=1;showGame()}
});

/* ---------- shared game plumbing ---------- */
function showGame(){show(G.type==='x01'?'game':G.type);drawAny()}
function drawAny(){if(G.type==='x01')draw();else if(G.type==='cricket')drawCr();else drawAtw()}
function nextTurn(){G.turn=(G.turn+1)%G.players.length;G.dartsLeft=3}
function snap(){
  G.hist.push(JSON.stringify({players:G.players,turn:G.turn,dartsLeft:G.dartsLeft,over:G.over,winner:G.winner}));
  if(G.hist.length>300)G.hist.shift();
}
function undo(){
  if(!G)return;
  if(G.type==='x01'){
    if(!G.log.length)return;
    const e=G.log.pop();
    G.players[e.p].visits.pop();
    G.players[e.p].score=e.prev;
    G.turn=e.p;G.over=false;G.winner=null;entry='';
  }else{
    if(!G.hist.length)return;
    Object.assign(G,JSON.parse(G.hist.pop()));cm=1;
  }
  save();drawAny();
}
function endTurn(){
  if(!G||G.over)return;
  snap();nextTurn();cm=1;
  say(G.players[G.turn].name+"'s turn.");
  save();drawAny();
}
function winUI(title,stats){
  if(G.over){$('winTitle').textContent=title;$('winStats').textContent=stats;$('winModal').classList.add('on')}
  else $('winModal').classList.remove('on');
}
document.querySelectorAll('.js-undo').forEach(b=>b.addEventListener('click',undo));
document.querySelectorAll('.js-menu').forEach(b=>b.addEventListener('click',()=>{drawSetup();show('setup')}));
$('winUndo').addEventListener('click',undo);
$('winMenu').addEventListener('click',()=>{$('winModal').classList.remove('on');drawSetup();show('setup')});
$('rematch').addEventListener('click',()=>{
  const list=G.players.map(p=>p.name);
  const game=G.type==='x01'?String(G.start):G.type;
  G=newGame(game,list,{dbl:G.dbl,skip:G.skip});
  entry='';cm=1;save();$('winModal').classList.remove('on');drawAny();
});
$('cend').addEventListener('click',endTurn);
$('aend').addEventListener('click',endTurn);

/* ---------- X01 ---------- */
function avg(p){const n=p.visits.length;return n?(p.visits.reduce((a,v)=>a+v.v,0)/n).toFixed(1):'–'}
function draw(){
  $('t-x01').textContent=G.start+(G.dbl?' · Double out':' · Straight out');
  $('cards').innerHTML=G.players.map((p,i)=>{
    const last=p.visits.length?(p.visits[p.visits.length-1].bust?'Bust':p.visits[p.visits.length-1].v):'–';
    return `<div class="pc ${i===G.turn&&!G.over?'cur':''}"><div class="n">${esc(p.name)}</div><div class="s">${p.score}</div><div class="m">Avg ${avg(p)} · Last ${last}</div></div>`;
  }).join('');
  const p=G.players[G.turn];
  $('turn').textContent=G.over?'':p.name+"'s turn";
  const d=$('display');
  d.textContent=entry===''?'0':entry;
  d.classList.toggle('dim',entry==='');
  const v=entry===''?null:parseInt(entry,10);
  $('leave').textContent=(v!==null&&v<=p.score)?'Leaves '+(p.score-v):'';
  const w=G.players[G.winner];
  winUI(G.over?w.name+' wins!':'',G.over?'3-dart average '+avg(w)+' over '+w.visits.length+' visits':'');
}
function key(k){
  if(!G||G.type!=='x01'||G.over||$('dblModal').classList.contains('on'))return;
  if(k==='del')entry=entry.slice(0,-1);
  else if(k==='go')return submit();
  else if(entry.length<3)entry+=k;
  draw();
}
$('keys').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)key(b.dataset.k)});
document.addEventListener('keydown',e=>{
  if(!$('game').classList.contains('on'))return;
  if(/^[0-9]$/.test(e.key))key(e.key);
  else if(e.key==='Backspace')key('del');
  else if(e.key==='Enter')key('go');
});
let pendingV=0;
function submit(){
  if(entry==='')return;
  const v=parseInt(entry,10);
  if(v>180||IMPOSSIBLE.includes(v)){toast("That score isn't possible with 3 darts");entry='';draw();return}
  const p=G.players[G.turn],left=p.score-v;
  const bust=left<0||(G.dbl&&left===1);
  if(!bust&&left===0&&G.dbl){pendingV=v;$('dblModal').classList.add('on');return}
  commit(v,bust);
}
function commit(v,bust){
  const p=G.players[G.turn];
  G.log.push({p:G.turn,prev:p.score});
  let msg;
  if(bust){p.visits.push({v:0,bust:true});toast('Bust!');msg='Bust! No score.'}
  else{
    p.score-=v;p.visits.push({v,bust:false});if(v>=95)celebrate(v);
    msg=(v?words(v)+(v>=100?'!':'.'):'No score.')+' '+words(p.score)+' left.';
  }
  entry='';
  if(p.score===0&&!bust){G.over=true;G.winner=G.turn;if(v<95)confetti();msg='Game shot! '+p.name+' wins.'}
  else G.turn=(G.turn+1)%G.players.length;
  say(msg);
  save();draw();
}
$('dblYes').addEventListener('click',()=>{$('dblModal').classList.remove('on');commit(pendingV,false)});
$('dblNo').addEventListener('click',()=>{$('dblModal').classList.remove('on');commit(pendingV,true)});

/* ---------- Cricket ---------- */
function drawCr(){
  const P=G.players,n=P.length;
  let h=`<div class="cb" style="grid-template-columns:44px repeat(${n},1fr)"><div></div>`;
  P.forEach((p,i)=>h+=`<div class="ch ${i===G.turn&&!G.over?'cur':''}">${esc(p.name)}</div>`);
  CT.forEach(t=>{
    h+=`<div class="ct">${t===25?'Bull':t}</div>`;
    P.forEach((p,i)=>h+=`<div class="cm ${i===G.turn&&!G.over?'cur':''} ${p.marks[t]>=3?'done':''}">${MK[p.marks[t]]}</div>`);
  });
  h+='<div class="ct">Pts</div>';
  P.forEach(p=>h+=`<div class="cp">${p.pts}</div>`);
  h+='</div>';
  $('cboard').innerHTML=h;
  const p=P[G.turn];
  $('cturn').textContent=G.over?'':p.name+"'s turn";
  $('cdarts').textContent=G.over?'':'●'.repeat(G.dartsLeft)+'○'.repeat(3-G.dartsLeft);
  document.querySelectorAll('#cmult button').forEach(b=>b.classList.toggle('on',+b.dataset.m===cm));
  const w=P[G.winner];
  winUI(G.over?w.name+' wins!':'',G.over?w.pts+' points':'');
}
$('cmult').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b){cm=+b.dataset.m;drawCr()}});
$('ctargets').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)crHit(+b.dataset.t)});
function crHit(t){
  if(G.over)return;
  snap();
  const p=G.players[G.turn];
  let m=cm;if(t===25&&m>2)m=2;
  let label;
  if(t===0){label='Miss'}
  else{
    for(let k=0;k<m;k++){
      if(p.marks[t]<3)p.marks[t]++;
      else if(G.players.some((q,i)=>i!==G.turn&&q.marks[t]<3))p.pts+=t;
    }
    label=(m===3?'Triple ':m===2?'Double ':'')+(t===25?'bull':words(t));
  }
  G.dartsLeft--;cm=1;
  const closed=CT.every(x=>p.marks[x]>=3);
  const maxOpp=Math.max(-1,...G.players.filter((_,i)=>i!==G.turn).map(q=>q.pts));
  let msg=label+'.';
  if(closed&&p.pts>=maxOpp){G.over=true;G.winner=G.turn;msg='Game shot! '+p.name+' wins.';confetti()}
  else if(G.dartsLeft===0){nextTurn();msg+=' '+G.players[G.turn].name+"'s turn."}
  say(msg);save();drawCr();
}

/* ---------- Around the World ---------- */
function drawAtw(){
  const P=G.players;
  $('acards').innerHTML=P.map((p,i)=>`<div class="pc ${i===G.turn&&!G.over?'cur':''}"><div class="n">${esc(p.name)}</div><div class="s" style="font-size:30px">${p.target===21?'Bull':p.target}</div><div class="pb"><i style="width:${(p.target-1)/21*100}%"></i></div><div class="m">${p.darts} darts thrown</div></div>`).join('');
  const p=P[G.turn];
  $('aturn').textContent=G.over?'':p.name+"'s turn";
  $('aaim').textContent=G.over?'':'Aim: '+(p.target===21?'Bull':p.target);
  $('adarts').textContent=G.over?'':'●'.repeat(G.dartsLeft)+'○'.repeat(3-G.dartsLeft);
  $('abtns').innerHTML='<button class="miss" data-a="0">Miss</button><button data-a="1">'+(p.target===21?'Hit bull':'Hit')+'</button>'
    +(G.skip&&p.target<21?'<button data-a="2">Double (+2)</button><button data-a="3">Triple (+3)</button>':'');
  const w=P[G.winner];
  winUI(G.over?w.name+' wins!':'',G.over?'Finished in '+w.darts+' darts':'');
}
$('abtns').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)atwThrow(+b.dataset.a)});
function atwThrow(a){
  if(G.over)return;
  snap();
  const p=G.players[G.turn];
  p.darts++;
  let msg='';
  if(a>0){
    if(p.target===21){G.over=true;G.winner=G.turn;msg='Bullseye! '+p.name+' wins.';confetti()}
    else{p.target=Math.min(21,p.target+a);msg=p.target===21?'Now the bull.':words(p.target)+'.'}
  }
  G.dartsLeft--;
  if(!G.over&&G.dartsLeft===0){nextTurn();msg+=' '+G.players[G.turn].name+"'s turn."}
  if(msg)say(msg);
  save();drawAtw();
}

/* ---------- toast, banner, confetti ---------- */
let tt;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}
function celebrate(v){
  const b=$('banner');b.textContent=v+'!';b.classList.remove('on');void b.offsetWidth;b.classList.add('on');
  confetti();
  if(navigator.vibrate)navigator.vibrate(v===180?[80,60,80,60,160]:[120]);
}
const cv=$('confetti'),cx=cv.getContext('2d');let parts=[],raf=0;
function confetti(){
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#f4c430','#e63946','#2a9d8f','#457b9d','#ffffff','#f4a261'];
  for(let i=0;i<170;i++)parts.push({x:innerWidth/2,y:innerHeight*0.38,vx:(Math.random()-.5)*18,vy:Math.random()*-15-2,s:5+Math.random()*7,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:0});
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.y<cv.height+20&&p.life<220);
  for(const p of parts){
    p.vy+=.4;p.vx*=.995;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();
  }
  if(parts.length)raf=requestAnimationFrame(loop);else{raf=0;cx.clearRect(0,0,cv.width,cv.height)}
}

/* ---------- start ---------- */
drawSetup();
drawSound();
loadVoices();
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=loadVoices;
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
